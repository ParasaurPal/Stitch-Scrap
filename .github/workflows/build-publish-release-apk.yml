name: Build Full Stitch & Scrap Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-app-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build complete React app for Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web app dependencies
        run: npm install --no-audit --no-fund

      - name: Build complete React application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync full web application into Android project
        run: npx cap sync android

      - name: Apply Stitch & Scrap launcher artwork
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages --quiet Pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icons/icon-512.png")
          if not source.is_file():
              raise SystemExit("Missing icons/icon-512.png launcher artwork")
          artwork = Image.open(source).convert("RGBA")
          if artwork.width != artwork.height:
              raise SystemExit(f"Launcher artwork must be square, got {artwork.size}")

          res = Path("android/app/src/main/res")
          legacy_sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          adaptive_sizes = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}

          for density, size in legacy_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = artwork.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          for density, size in adaptive_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              foreground = artwork.resize((int(size * 0.72), int(size * 0.72)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(foreground, ((size - foreground.width) // 2, (size - foreground.height) // 2))
              canvas.save(folder / "ic_launcher_foreground.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)

          colors = res / "values"
          colors.mkdir(parents=True, exist_ok=True)
          color_file = colors / "ic_launcher_background.xml"
          color_file.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#211B24</color></resources>
          """)
          print("Applied uploaded Stitch & Scrap artwork to legacy and adaptive Android launcher icons.")
          PY

      - name: Configure immersive mode and stable release signing
        shell: bash
        env:
          STITCH_KEYSTORE_BASE64: ${{ secrets.STITCH_KEYSTORE_BASE64 }}
          STITCH_STORE_PASSWORD: ${{ secrets.STITCH_STORE_PASSWORD }}
          STITCH_KEY_ALIAS: ${{ secrets.STITCH_KEY_ALIAS }}
          STITCH_KEY_PASSWORD: ${{ secrets.STITCH_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -z "${STITCH_KEYSTORE_BASE64:-}" || -z "${STITCH_STORE_PASSWORD:-}" || -z "${STITCH_KEY_ALIAS:-}" || -z "${STITCH_KEY_PASSWORD:-}" ]]; then
            echo "::error::Add the four stable Android signing secrets listed in the repository instructions before building."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$STITCH_KEYSTORE_BASE64" | base64 --decode > android/keystore/stitch-release.jks
          python3 <<'PY'
          from pathlib import Path
          import os, re

          java_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not java_files:
              raise SystemExit("Capacitor MainActivity.java was not generated")
          main_activity = java_files[0]
          package = re.search(r"^package\s+([\w.]+);", main_activity.read_text(), re.M)
          if not package:
              raise SystemExit("Could not determine generated Android package name")
          main_activity.write_text(f"""package {package.group(1)};

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  applyImmersiveMode();
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersiveMode();
              }}

              private void applyImmersiveMode() {{
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }}
          }}
          """)

          gradle_file = Path("android/app/build.gradle")
          gradle = gradle_file.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("keystore/stitch-release.jks")
                      storePassword System.getenv("STITCH_STORE_PASSWORD")
                      keyAlias System.getenv("STITCH_KEY_ALIAS")
                      keyPassword System.getenv("STITCH_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in gradle:
              gradle = gradle.replace("android {", "android {" + signing, 1)
          gradle = re.sub(r"versionCode\s+\d+", f"versionCode {os.environ['BUILD_NUMBER']}", gradle, count=1)
          gradle = re.sub(r"(buildTypes\s*\{\s*release\s*\{)", r"\\1\\n            signingConfig signingConfigs.release", gradle, count=1)
          if "signingConfig signingConfigs.release" not in gradle:
              raise SystemExit("Could not configure stable release signing")
          gradle_file.write_text(gradle)
          print(f"Configured {main_activity}, stable release signing, and versionCode {os.environ['BUILD_NUMBER']}")
          PY

      - name: Verify Android package and launcher resources
        working-directory: android
        run: |
          APK_PATH="app/src/main/AndroidManifest.xml"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$APK_PATH"
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          echo "Launcher icon resources and manifest references verified."
      - name: Build installable release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          rm -rf app/keystore

      - name: Name APK after the application
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release
          cp "$APK" "release/Stitch-and-Scrap.apk"
          ls -lh "release/Stitch-and-Scrap.apk"

      - name: Publish directly downloadable APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Stitch & Scrap Android APK
          body: |
            Installable Android build of the complete Stitch & Scrap React application.
            Download **Stitch-and-Scrap.apk** and install it on your Android device.
          files: release/Stitch-and-Scrap.apk
          make_latest: true
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
