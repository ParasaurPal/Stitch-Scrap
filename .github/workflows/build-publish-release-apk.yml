name: Build & Publish Release APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Gradle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Releasing using Hub
        uses: sangatdesai/release-apk@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_FOLDER: native-android/app
